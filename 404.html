<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root { --bg:#fff; --ink:#16191c; --muted:#5f666d; --red:#e8112d; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c0e11; --ink:#eceef0; --muted:#9aa2a9; --red:#ff4d5e; color-scheme: dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
  font-family:"Geist",-apple-system,system-ui,sans-serif; padding:0 max(16px,env(safe-area-inset-left,0px)); text-align:center; }
h1 { font-size:clamp(2.5rem,1.6rem+4vw,4rem); letter-spacing:-0.04em; margin:0 0 .5rem; font-weight:600; }
h1 span { color:var(--red); }
p { color:var(--muted); margin:0 0 1.75rem; }
a.home { display:inline-block; background:var(--ink); color:var(--bg); text-decoration:none; padding:.75rem 1.4rem; border-radius:999px; font-weight:500; }
</style>
</head>
<body>
<main>
  <h1>4<span>0</span>4</h1>
  <p>That page doesn't exist.</p>
  <a class="home" href="/">Back to the homepage</a>
</main>
</body>
</html>
